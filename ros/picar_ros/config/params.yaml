# Node parameters for picar.launch.py. The `hardware` launch argument overrides the
# controller's `hardware` value.
#
# Tune the planner values on the robot and note the final values in the PR.

controller:
  ros__parameters:
    hardware: fake
    # Scripted readings for the fake hardware, in cm. The last value repeats.
    fake_distances_cm: [100.0]
    sensor_period_ms: 30.0   # one range, greyscale and joint-state message per period (a target)
    motor_tick_ms: 10.0      # how often the motors are updated from the plan
    hard_stop_cm: 10.0       # forward drive stops when the range is closer than this
    range_stale_ms: 150.0    # no valid range for this long also stops forward drive
    plan_timeout_ms: 500.0   # no new plan for this long stops all motors
    slow_write_ms: 100.0     # warn when one motor write takes longer than this

motion_planner:
  ros__parameters:
    rate_hz: 10.0            # plans per second (5 to 10)
    stop_distance_cm: 20.0   # obstacle closer than this starts stop/reverse/turn
    cruise_power: 50.0       # forward motor power while cruising, in (0, 100]
    reverse_power: 30.0
    turn_power: 50.0
    stop_duration_s: 0.2
    reverse_duration_s: 0.4
    turn_duration_s: 1.0     # how long the turn lasts
    frame_stale_ms: 500.0    # an older range makes the plan a stop
