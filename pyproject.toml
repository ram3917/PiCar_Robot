# uv workspace root. Dependencies, the virtualenv (.venv) and the lock file (uv.lock) are
# managed from here for every Python member. The ROS package (ros/picar_ros) is built with
# colcon, not uv, so it is not a member.
#
#   uv sync                        # create .venv and install all members + dev tools
#   uv run --package picar-core pytest core
#
[tool.uv.workspace]
members = ["core"]

[dependency-groups]
dev = [
    "pytest>=7",
    "mypy>=1.0",
]
