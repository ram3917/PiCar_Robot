name: test

on:
  push:
  pull_request:
  workflow_call:  # release.yml runs these tests before it publishes a wheel

jobs:
  picar:
    name: picar tests (ROS 2 Jazzy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the dev image
        run: docker build -f docker/Dockerfile -t picar-test .

      # The image holds ROS 2 and picar-4wd; the tests run against the source in picar/.
      - name: Build and test the package
        run: |
          docker run --rm --entrypoint bash -v "$PWD/picar:/ws/src/picar" -w /ws picar-test -c '
            set -eo pipefail
            source /opt/ros/jazzy/setup.bash
            rm -rf install
            colcon build --symlink-install --packages-select picar
            source install/setup.bash
            python3 -m pytest src/picar
          '
