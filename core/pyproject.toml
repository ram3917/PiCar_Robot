[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "picar-core"
version = "0.0.0"
description = "Pure-Python core for the PiCar-4WD robot: hardware interface, state machine and watchdog."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Rama Mallavarapu" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "mypy>=1.0"]

[dependency-groups]
dev = ["pytest>=7", "mypy>=1.0"]

[tool.setuptools.packages.find]
include = ["picar_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
