[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "picar-core"
version = "0.0.0"
description = "Pure-Python core for the PiCar-4WD robot: hardware interface, motion planner and safety limits."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Rama Mallavarapu" }]
dependencies = []

# Test tools live in the workspace root's dev group (see ../pyproject.toml).

[tool.setuptools.packages.find]
include = ["picar_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
