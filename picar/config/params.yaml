# Node parameters for picar.launch.py. The `hardware` and `drive` launch arguments override the
# controller's `hardware` and the planner's `drive` values.
#
# Tune the planner values on the robot and note the final values in the PR.

controller:
  ros__parameters:
    hardware: fake
    # Scripted readings for the fake hardware, in metres. The last value repeats.
    fake_ranges_m: [1.0]
    # hardware:=sim: a wall that closes as the robot drives forward at sim_speed_mps (full
    # power); each turn in place faces the next distance, cycling. In metres.
    sim_walls_m: [1.0, 0.6, 1.5]
    sim_speed_mps: 0.3
    sensor_period_ms: 30.0   # one servo step, greyscale and joint-state message per period (a target)
    motor_tick_ms: 10.0      # how often the motors are updated from the latest command
    # The servo sweep. Each pass publishes one LaserScan on /controller/scan. Sweeping never
    # moves the robot: the motors stay as /cmd_vel sets them (the planner's drive is false).
    sweep_enabled: true
    sweep_min_deg: -90.0     # positive angles are to the left
    sweep_max_deg: 90.0
    sweep_step_deg: 5.0      # 37 steps per pass, about 1.1 s at sensor_period_ms 30
    # Only readings within 15 degrees of forward count as the forward range. Forward readings
    # arrive about once per pass, so the stale window must be longer than one pass.
    hard_stop_m: 0.25        # forward drive stops when the forward range is closer than this
    range_stale_ms: 1500.0   # no forward range for this long also stops forward drive
    cmd_timeout_ms: 500.0    # no new /cmd_vel for this long stops all motors
    slow_write_ms: 100.0     # warn when one motor write takes longer than this

planner:
  ros__parameters:
    drive: false             # the on switch: nothing is commanded while false
    rate_hz: 10.0            # commands per second
    stop_distance_m: 0.20    # obstacle closer than this starts stop/reverse/turn
    cruise_speed: 0.5        # normalized speeds, in (0, 1]
    reverse_speed: 0.3
    turn_speed: 0.5
    stop_duration_s: 0.2
    reverse_duration_s: 0.4
    turn_duration_s: 1.0     # how long the turn lasts
    range_stale_ms: 1500.0   # an older forward range makes the command a stop (one sweep pass apart)
