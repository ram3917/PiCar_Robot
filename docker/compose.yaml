# Runs the PiCar stack on the Pi. See docs/deployment.md.
name: picar

services:
  picar:
    image: picar:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    network_mode: host
    restart: unless-stopped
    devices:
      - /dev/i2c-1:/dev/i2c-1
      - /dev/gpiomem:/dev/gpiomem
      - /dev/gpiochip0:/dev/gpiochip0
    volumes:
      # rosbag2 recordings (PICAR_RECORD=true) land here, next to this file's folder.
      - ../data:/data
    environment:
      PICAR_HARDWARE: ${PICAR_HARDWARE:-picar4wd}
      # false keeps the robot still; true lets the planner drive. Or: ros2 param set /planner drive true
      PICAR_DRIVE: ${PICAR_DRIVE:-false}
      PICAR_RECORD: ${PICAR_RECORD:-false}
      # Pi 3 Model B+ board revision (from /proc/cpuinfo on the host). The container cannot read
      # /proc/device-tree, so rpi-lgpio needs it here.
      RPI_LGPIO_REVISION: a020d3
